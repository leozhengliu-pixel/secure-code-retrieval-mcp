apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-code-retrieval-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-code-retrieval-mcp
  template:
    metadata:
      labels:
        app: secure-code-retrieval-mcp
    spec:
      containers:
        - name: server
          image: secure-code-retrieval-mcp:latest
          env:
            - name: SCRM_CONFIG
              value: /etc/secure-code-retrieval/config.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/secure-code-retrieval
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: secure-code-retrieval-mcp-config
