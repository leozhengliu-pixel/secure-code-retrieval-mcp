name: docker-publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install smoke test dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: secure-code-retrieval-mcp:release-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare smoke test config
        id: smoke-config
        shell: bash
        run: |
          set -euo pipefail
          output="$(SMOKE_SUBJECT=release-smoke ./scripts/prepare-smoke-env.sh)"
          workdir="$(printf '%s\n' "$output" | sed -n 's/^workdir=//p')"
          token="$(printf '%s\n' "$output" | sed -n 's/^token=//p')"
          echo "workdir=$workdir" >>"$GITHUB_OUTPUT"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Start container for release smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name secure-code-retrieval-mcp-release \
            -p 18080:8080 \
            -e SCRM_CONFIG=/work/config.yaml \
            -v "${{ steps.smoke-config.outputs.workdir }}:/work" \
            secure-code-retrieval-mcp:release-smoke

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if curl --silent --show-error http://127.0.0.1:18080/readyz | jq -e '.status == "ready"' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs secure-code-retrieval-mcp-release
          exit 1

      - name: Run MCP smoke test
        env:
          MCP_URL: http://127.0.0.1:18080/mcp
          MCP_BEARER_TOKEN: ${{ steps.smoke-config.outputs.token }}
        run: ./scripts/mcp-smoke-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs secure-code-retrieval-mcp-release

      - name: Stop release smoke container
        if: always()
        run: docker rm -f secure-code-retrieval-mcp-release || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
